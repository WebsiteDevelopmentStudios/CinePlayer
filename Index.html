<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinePlayer</title>
    <!-- Additional styles for the movie tiles section -->
    <style>
       .movie-tile {
            display: inline-block;
            width: 200px;
            margin: 10px;
            padding: 10px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
            transition: transform 0.2s ease-in-out;
        }
       .movie-tile:hover {
            transform: scale(1.1);
        }
       .movie-tile img {
            width: 180px;
            height: 270px;
            object-fit: cover;
            border-radius: 5px;
        }
       .movie-tile h3 {
            margin: 10px 0;
            font-size: 1rem;
        }
    </style>
    <!-- Other head elements remain the same -->
    <!--... -->
</head>
<body>
    <!-- Header remains the same -->
    <!--... -->

    <!-- Movie tiles section -->
    <div class="container">
        <h1>Popular Movies</h1>
        <div id="movieTiles">
            <!-- Movie tiles will be dynamically populated here -->
        </div>
    </div>

    <!-- IMDb ID mapping to movie details -->
    <script>
        const movies = {
            'tt0068646': { title: 'The Godfather', poster: 'https://m.media-amazon.com/images/M/MV5BM2MyNjYxNmUtYTAwNi00MTYxLWJmNWYtYzZlODY3ZTk3OTFlXkEyXkFqcGdeQXVyNzkwMjQ5NzM@._V1_.jpg' },
            'tt0796366': { title: 'The Dark Knight', poster: 'https://m.media-amazon.com/images/M/MV5BMTcyODk1NDAyN15BMl5BanBnXkFtZTcwNDI0Mzc3MQ@@._V1_.jpg' },
            'tt0182789': { title: 'Breaking Bad', poster: 'https://m.media-amazon.com/images/M/MV5BVHJlZmU4YjEtNmRiZi00MDQwLWFjY2MtMTQ3NzY4ODdjMzNhXkEyXkFqcGdeQXVyODk4OTc3MTY@._V1_.jpg' },
            // Add more movies here...
        };
    </script>

    <!-- Script to populate movie tiles and handle clicks -->
    <script>
        const movieTilesContainer = document.getElementById('movieTiles');

        for (const imdbId in movies) {
            const movie = movies[imdbId];
            const tile = document.createElement('div');
            tile.classList.add('movie-tile');
            tile.innerHTML = `
                <img src="${movie.poster}" alt="${movie.title}">
                <h3>${movie.title}</h3>
            `;
            tile.addEventListener('click', function() {
                window.location.href = `custom-player.html?imdb=${imdbId}`;
            });
            movieTilesContainer.appendChild(tile);
        }
    </script>

    <!-- Other body elements remain the same -->
    <!--... -->
</body>
</html>
