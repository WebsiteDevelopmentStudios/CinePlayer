<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinePlayer</title>
    <style>
        /*...previous styles... */
       .movie-browser {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
            padding: 0 50px;
            width: 100%;
            box-sizing: border-box;
        }
       .movie-item {
            background-color: #2a2a2a;
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
        }
       .movie-item img {
            width: 100%;
            height: auto;
            display: block;
        }
       .movie-item p {
            margin: 10px;
            text-align: center;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!--...previous HTML... -->

    <div class="movie-browser"></div>

    <!--...previous HTML... -->

    <script>
        const movieLinks = [
            'https://www.imdb.com/title/tt28650488/',
            'https://www.imdb.com/title/tt11127680/',
            'https://www.imdb.com/title/tt10648342/',
            'https://www.imdb.com/title/tt16300234/',
            'https://www.imdb.com/title/tt12412888/',
            // Add more movie links here
        ];

        const movieBrowser = document.querySelector('.movie-browser');

        movieLinks.forEach(link => {
            const movieId = link.split('/').pop();
            const movieItem = document.createElement('div');
            movieItem.classList.add('movie-item');
            movieItem.innerHTML = `
                <img src="https://img.youtube.com/vi/${movieId}/mqdefault.jpg" alt="Movie Poster">
                <p>Movie ${movieId}</p>
            `;
            movieItem.addEventListener('click', () => {
                window.location.href = `custom-player.html?imdb=${movieId}`;
            });
            movieBrowser.appendChild(movieItem);
        });
    </script>

</body>
</html>
