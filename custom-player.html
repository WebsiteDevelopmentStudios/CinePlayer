<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Custom Player</title>
  <style>
    html, body { 
      margin: 0; padding: 0; width: 100%; height: 100%; 
      background: #000; color: #fff; font-family: Arial, sans-serif; 
      overflow: hidden; touch-action: none; position: fixed;
    }
    video { width: 100vw; height: 100vh; object-fit: contain; background: #000; display: none; }
    #status { 
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      text-align: center; padding: 20px; z-index: 10; max-width: 90vw; word-break: break-word;
    }
    button {
      margin-top: 15px; padding: 10px 20px; background: #fff; color: #000;
      border: none; border-radius: 5px; cursor: pointer; font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="status">Fetching stream...</div>
  <video id="video" controls autoplay playsinline webkit-playsinline muted></video>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const imdb = urlParams.get('imdb') || 'tt1375666'; 
    const apiUrl = `/api/getstream?imdb=${imdb}`;

    const video = document.getElementById('video');
    const statusEl = document.getElementById('status');

    // Proxy that reliably passes raw text/binary for m3u8 and ts chunks
    const PROXY_URL = (url) => `https://corsproxy.io/?url=${encodeURIComponent(url)}`;

    let hls = null;
    let unmuted = false;

    const unmute = () => {
      if (!unmuted) {
        video.muted = false;
        unmuted = true;
        video.play().catch(() => {});
      }
    };
    document.addEventListener('click', unmute);
    document.addEventListener('touchstart', unmute);

    function showError(msg) {
      statusEl.style.display = 'block';
      video.style.display = 'none';
      statusEl.innerHTML = `Stream failed to load.<br><br><small style="opacity:0.7">${msg}</small><br><button onclick="location.reload()" style="margin-top: 20px;">Reload Player</button>`;
    }

    async function init() {
      // Silent warmup
      fetch(apiUrl).catch(() => {});
      
      try {
        statusEl.innerText = "Fetching stream...";
        const res = await fetch(apiUrl);
        const text = await res.text();
        
        let data;
        try {
            data = JSON.parse(text);
        } catch (e) {
            throw new Error(`API Response: ${text.substring(0, 150)}`);
        }
        
        if (!data.streamUrl) {
          throw new Error(data.error || "API did not return a stream URL.");
        }

        statusEl.style.display = 'none';
        video.style.display = 'block';

        await startPlayback(data.streamUrl);
        
      } catch (error) {
        showError(error.message);
      }
    }

    async function startPlayback(streamUrl) {
      const isIOS = video.canPlayType('application/vnd.apple.mpegurl');

      // Try native player first for all platforms (Safari works, but sometimes Chrome can play directly if CORS is open initially)
      if (isIOS) {
        video.src = streamUrl;
        video.addEventListener('loadedmetadata', () => {
          video.play().catch(e => console.log("Autoplay blocked: ", e));
        }, { once: true });
        
        video.onerror = async () => {
          console.log("Native iOS failed, trying HLS.js with manifest rewriting...");
          video.removeAttribute('src');
          video.load();
          await startHlsWithRewrittenManifest(streamUrl);
        };
      } else {
        await startHlsWithRewrittenManifest(streamUrl);
      }
    }

    // Renderer Logic: Fetch m3u8 text via proxy, rewrite chunk URLs to use proxy, feed as Blob to hls.js
    async function startHlsWithRewrittenManifest(streamUrl) {
      if (hls) hls.destroy();

      if (!window.Hls || !Hls.isSupported()) {
        showError("HLS not supported in this browser.");
        return;
      }

      try {
        statusEl.style.display = 'block';
        statusEl.innerText = "Bypassing CORS (Rewriting Manifest)...";
        
        // 1. Fetch the raw manifest text through the proxy
        const proxiedManifestUrl = PROXY_URL(streamUrl);
        const m3u8Res = await fetch(proxiedManifestUrl);
        if (!m3u8Res.ok) throw new Error("Failed to load manifest via proxy.");
        
        const m3u8Text = await m3u8Res.text();
        const lines = m3u8Text.split('\n');

        // 2. Rewrite every internal URL to go through the proxy
        for (let i = 0; i < lines.length; i++) {
          const line = lines[i].trim();
          if (line && !line.startsWith('#')) {
            // If it's a relative URL, resolve it against the original stream URL
            const absoluteUrl = new URL(line, streamUrl).href;
            lines[i] = PROXY_URL(absoluteUrl);
          } else if (line.startsWith('#EXT-X-KEY') || line.startsWith('#EXT-X-MAP')) {
            // Rewrite URI="..." inside tags
            lines[i] = line.replace(/URI="([^"]+)"/g, (match, p1) => {
              const absoluteUrl = new URL(p1, streamUrl).href;
              return `URI="${PROXY_URL(absoluteUrl)}"`;
            });
          }
        }

        const rewrittenManifest = lines.join('\n');

        // 3. Create a local Blob URL from the rewritten manifest
        const blob = new Blob([rewrittenManifest], { type: 'application/vnd.apple.mpegurl' });
        const blobUrl = URL.createObjectURL(blob);

        statusEl.style.display = 'none';

        // 4. Hand the Blob URL directly to hls.js (No xhrSetup needed, URLs are already proxied)
        hls = new Hls({ maxBufferLength: 30 });
        hls.loadSource(blobUrl);
        hls.attachMedia(video);

        const timeout = setTimeout(() => {
          showError("Video chunks failed to load via the proxy. Host might be completely blocking proxies.");
        }, 10000);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          clearTimeout(timeout);
          video.play().catch(e => console.log("Autoplay blocked: ", e));
        });

        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            clearTimeout(timeout);
            console.error("HLS.js FATAL Error:", data.details);
            showError(`Video chunk error: ${data.details}`);
          }
        });

      } catch (error) {
        showError("Failed to bypass CORS: " + error.message);
      }
    }

    init();
  </script>
</body>
  </html>
