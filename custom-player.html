<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinePlayer Custom</title>
    <!-- Include HLS.js to play .m3u8 streams -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { background: #111; color: #fff; text-align: center; font-family: Arial, sans-serif; padding-top: 40px; }
        video { max-width: 90%; width: 800px; margin: 20px auto; display: block; }
    </style>
</head>
<body>
    <h2 id="status">Fetching stream...</h2>
    <video id="video" controls></video>

    <script>
        // 1. Grab IMDb ID from URL (?imdb=tt1375666). If missing, default to Mario movie.
        const urlParams = new URLSearchParams(window.location.search);
        const imdbId = urlParams.get('imdb') || 'tt6718170'; 

        async function loadStream() {
            document.getElementById('status').innerText = 'Contacting server for IMDb: ' + imdbId;
            
            try {
                // 2. Fetch from your Vercel API
                const res = await fetch(`/api/getstream?imdb=${imdbId}`);
                const data = await res.json();

                // 3. Handle the response
                if (data.success && data.streamUrl) {
                    document.getElementById('status').innerText = 'Now Playing...';
                    
                    const video = document.getElementById('video');
                    if (Hls.isSupported()) {
                        const hls = new Hls();
                        hls.loadSource(data.streamUrl);
                        hls.attachMedia(video);
                    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                        video.src = data.streamUrl;
                    }
                } else {
                    document.getElementById('status').innerText = 'Error: ' + (data.error || 'Stream not found');
                }
            } catch (err) {
                document.getElementById('status').innerText = 'Error fetching API.';
                console.error(err);
            }
        }

        loadStream();
    </script>
</body>
</html>
