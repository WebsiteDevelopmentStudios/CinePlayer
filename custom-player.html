<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinePlayer - Custom</title>
    <style>
        body { 
            margin: 0; 
            background: #000; 
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }
        #video { 
            width: 100%; 
            height: 100%; 
            background: #000;
        }
        #status { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            text-align: center;
            font-size: 1.2rem;
            max-width: 80%;
        }
    </style>
</head>
<body>
    <div id="status">Fetching stream...</div>
    <video id="video" controls autoplay playsinline></video>

    <!-- Load HLS.js to play .m3u8 streams -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const imdb = params.get('imdb');

        const video = document.getElementById('video');
        const status = document.getElementById('status');

        if (!imdb) {
            status.innerText = "Error: No IMDb ID provided in URL.";
        } else {
            fetch(`/api/getstream?imdb=${imdb}`)
                .then(res => res.json())
                .then(data => {
                    if (data.streamUrl) {
                        status.style.display = 'none';
                        const streamUrl = data.streamUrl;

                        // 1. Try native playback first (works for direct mp4s and Safari HLS)
                        video.src = streamUrl;
                        
                        video.addEventListener('error', function() {
                            // 2. If native fails, try HLS.js
                            if (Hls.isSupported()) {
                                const hls = new Hls();
                                hls.loadSource(streamUrl);
                                hls.attachMedia(video);
                                
                                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                                    video.play();
                                });

                                hls.on(Hls.Events.ERROR, function(event, data) {
                                    console.error('HLS Error:', data);
                                    status.innerText = "Stream Error: " + data.details + "\n\nURL: " + streamUrl;
                                    status.style.display = 'block';
                                });
                            } else {
                                status.innerText = "Error: Your browser does not support this stream.";
                                status.style.display = 'block';
                            }
                        });

                        video.play().catch(e => {
                            // Autoplay might be blocked, but the user can press play
                            console.log("Autoplay blocked:", e);
                        });

                    } else {
                        status.innerText = "Error: " + (data.error || "Stream not found.");
                    }
                })
                .catch(err => {
                    status.innerText = "Error: " + err.message;
                    status.style.display = 'block';
                });
        }
    </script>
</body>
</html>
