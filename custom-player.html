<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Disable user zoom and scaling on mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Custom Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    /* Prevent scrolling and touch actions */
    html, body { 
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000; 
      color: #fff; 
      font-family: Arial, sans-serif; 
      overflow: hidden; 
      touch-action: none;
      position: fixed;
    }
    
    /* Make video fill the screen */
    video { 
      width: 100vw;
      height: 100vh;
      object-fit: contain; /* Keeps aspect ratio but fills screen */
      background: #000; 
    }
    
    #status { 
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      padding: 20px; 
    }
    
    button {
      margin-top: 15px;
      padding: 10px 20px;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
    
    button:hover {
      background: #ccc;
    }
  </style>
</head>
<body>
  <div id="status">Fetching stream...</div>
  <video id="video" controls autoplay playsinline style="display:none;"></video>

  <script>
    const getQueryParam = (param) => {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    };

    const imdb = getQueryParam('imdb') || 'tt1375666'; 
    const apiUrl = `/api/getstream?imdb=${imdb}`;

    async function fetchStream(url, retries = 3) {
      for (let i = 0; i < retries; i++) {
        document.getElementById('status').innerText = `Fetching stream... (Attempt ${i + 1} of ${retries})`;
        try {
          const response = await fetch(url);
          const data = await response.json();
          
          if (response.ok && data.success && data.streamUrl) {
            return data.streamUrl;
          }
          console.log(`Attempt ${i + 1} failed:`, data.error);
        } catch (e) {
          console.log(`Network error on attempt ${i + 1}:`, e.message);
        }
        await new Promise(r => setTimeout(r, 1500));
      }
      return null;
    }

    // Helper to handle play logic and unmute fallback
    function startPlayback(video) {
      // Try to play unmuted right away
      video.muted = false;
      video.play().catch(() => {
        // If the browser blocks unmuted autoplay, fall back to muted play
        console.log("Unmuted autoplay blocked by browser. Falling back to muted.");
        video.muted = true;
        video.play().catch(err => console.log("Even muted autoplay failed: ", err));
        
        // Listen for the first user interaction to unmute it immediately
        const unmuteOnClick = () => {
          if (video.muted) {
            video.muted = false;
          }
          video.removeEventListener('click', unmuteOnClick);
          video.removeEventListener('touchstart', unmuteOnClick);
        };
        video.addEventListener('click', unmuteOnClick);
        video.addEventListener('touchstart', unmuteOnClick);
      });
    }

    async function init() {
      const statusEl = document.getElementById('status');
      const video = document.getElementById('video');
      
      const streamUrl = await fetchStream(apiUrl);
      
      if (!streamUrl) {
        statusEl.innerHTML = 'Failed to load stream after multiple attempts. It might be blocked temporarily.<br><button onclick="location.reload()">Reload Player</button>';
        return;
      }

      statusEl.style.display = 'none';
      video.style.display = 'block';

      // Handle HLS (.m3u8) playback
      if (streamUrl.includes('.m3u8')) {
        if (Hls.isSupported()) {
          const hls = new Hls();
          hls.loadSource(streamUrl);
          hls.attachMedia(video);
          
          hls.on(Hls.Events.ERROR, function(event, data) {
            console.error('HLS Error:', data);
          });

          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            startPlayback(video);
          });
          
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          // Native HLS support (Safari)
          video.src = streamUrl;
          video.addEventListener('loadedmetadata', () => {
            startPlayback(video);
          });
        }
      } else {
        // Handle direct video playback (.mp4)
        video.src = streamUrl;
        video.addEventListener('loadedmetadata', () => {
          startPlayback(video);
        });
      }
    }

    init();
  </script>
</body>
  </html>
