<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Disable pinch zoom for mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>CinePlayer</title>
    <style>
        body { 
            margin: 0; 
            background: #000; 
            color: #fff; 
            font-family: sans-serif;
            touch-action: pan-x pan-y; 
        }
        #player-container { max-width: 800px; margin: 50px auto; text-align: center; }
        #status { padding: 20px; font-size: 1.2rem; }
    </style>
</head>
<body>

<div id="player-container">
    <div id="status">Fetching stream...</div>
    <video id="video" controls playsinline width="100%" style="display:none;"></video>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>
    const params = new URLSearchParams(window.location.search);
    const imdb = params.get('imdb') || 'tt1226863';

    const videoElement = document.getElementById('video');
    const statusElement = document.getElementById('status');

    async function fetchStream() {
        try {
            const response = await fetch(`https://cineplayer-psi.vercel.app/api/getstream?imdb=${imdb}`);
            
            // Gracefully handle if Vercel returns an HTML error page instead of JSON
            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`API Error (${response.status}): ${errorText.substring(0, 100)}`);
            }

            const data = await response.json();

            if (data.success && data.streamUrl) {
                let streamUrl = data.streamUrl;
                statusElement.innerText = "Loading video...";
                playHLS(streamUrl);
            } else {
                statusElement.innerText = "Error: " + (data.error || "Could not find stream.");
            }
        } catch (error) {
            statusElement.innerText = "Fetch Error: " + error.message;
        }
    }

    function playHLS(originalUrl) {
        if (Hls.isSupported()) {
            // Removed the proxy to test if it works directly
            const hls = new Hls();
            
            hls.loadSource(originalUrl);
            hls.attachMedia(videoElement);
            
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                statusElement.style.display = 'none';
                videoElement.style.display = 'block';
                videoElement.play();
            });

            hls.on(Hls.Events.ERROR, function(event, data) {
                if (data.fatal) {
                    statusElement.innerText = "Stream Error: " + data.details;
                    statusElement.style.display = 'block';
                    videoElement.style.display = 'none';
                }
            });
        } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
            videoElement.src = originalUrl;
            videoElement.addEventListener('loadedmetadata', function() {
                statusElement.style.display = 'none';
                videoElement.style.display = 'block';
                videoElement.play();
            });
        }
    }

    fetchStream();
</script>

</body>
</html>
