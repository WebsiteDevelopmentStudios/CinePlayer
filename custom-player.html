<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Custom Player</title>
  <style>
    /* Prevent scrolling and touch actions */
    html, body { 
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000; 
      color: #fff; 
      font-family: Arial, sans-serif; 
      overflow: hidden; 
      touch-action: none;
      position: fixed;
    }
    
    #player { 
      width: 100vw;
      height: 100vh;
      border: none;
      position: absolute;
      top: 0;
      left: 0;
      background: #000; 
    }
    
    #status { 
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      padding: 20px; 
      z-index: 10;
    }
    
    button {
      margin-top: 15px;
      padding: 10px 20px;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
    
    button:hover {
      background: #ccc;
    }
  </style>
</head>
<body>
  <div id="status">Fetching stream...</div>
  <iframe id="player" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" style="display:none;"></iframe>

  <script>
    const getQueryParam = (param) => {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    };

    const imdb = getQueryParam('imdb') || 'tt1375666'; 
    const apiUrl = `/api/getstream?imdb=${imdb}`;

    async function fetchStream(url, retries = 2) {
      for (let i = 0; i < retries; i++) {
        document.getElementById('status').innerText = `Fetching stream... (Attempt ${i + 1} of ${retries})`;
        try {
          const response = await fetch(url);
          const data = await response.json();
          
          if (response.ok && data.success && data.streamUrl) {
            return data.streamUrl;
          }
          console.log(`Attempt ${i + 1} failed:`, data.error);
        } catch (e) {
          console.log(`Network error on attempt ${i + 1}:`, e.message);
        }
        // Minimal delay to let the serverless instance warm up
        await new Promise(r => setTimeout(r, 500));
      }
      return null;
    }

    async function init() {
      const statusEl = document.getElementById('status');
      const player = document.getElementById('player');
      
      const streamUrl = await fetchStream(apiUrl);
      
      if (!streamUrl) {
        statusEl.style.display = 'block';
        player.style.display = 'none';
        statusEl.innerHTML = 'Stream failed to load (API Timeout).<br><button onclick="location.reload()">Reload Player</button>';
        return;
      }

      statusEl.style.display = 'none';
      player.style.display = 'block';

      const safeStreamUrl = streamUrl.replace(/"/g, '\\"');

      const playerHtml = `
        <!DOCTYPE html>
        <html>
        <head>
          <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
          <style>
            html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
            video { width: 100%; height: 100%; object-fit: contain; }
          </style>
          <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"><\/script>
        </head>
        <body>
          <video id="v" controls autoplay playsinline></video>
          <script>
            var v = document.getElementById('v');
            var src = "${safeStreamUrl}";
            var isIOS = v.canPlayType('application/vnd.apple.mpegurl');
            var hls;
            var hlsTimeout;
            var hasStarted = false;
            
            function tryPlay() {
              v.muted = false;
              v.play().catch(function() {
                v.muted = true;
                v.play().catch(function(e){ console.log("Autoplay blocked: ", e); });
                
                var unmute = function() {
                  if(v.muted) v.muted = false;
                  v.removeEventListener('click', unmute);
                  v.removeEventListener('touchstart', unmute);
                };
                v.addEventListener('click', unmute);
                v.addEventListener('touchstart', unmute);
              });
            }

            function startDirectHls() {
              if (window.Hls && Hls.isSupported()) {
                hls = new Hls();
                hls.loadSource(src);
                hls.attachMedia(v);
                
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                  hasStarted = true;
                  clearTimeout(hlsTimeout);
                  tryPlay();
                });
                
                // Fallback Setup: If it takes longer than 4 seconds, bypass to proxy
                hlsTimeout = setTimeout(function() {
                  if (!hasStarted) {
                    console.log("Direct load too slow, falling back to proxy...");
                    hls.destroy();
                    startProxyHls();
                  }
                }, 4000);

                hls.on(Hls.Events.ERROR, function(event, data) {
                  if (data.fatal && data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                    clearTimeout(hlsTimeout);
                    hls.destroy();
                    startProxyHls();
                  }
                });
              }
            }

            function startProxyHls() {
              hls = new Hls({
                xhrSetup: function(xhr, url) {
                  if (url.indexOf('http') === 0) {
                    xhr.open('GET', 'https://corsproxy.io/?url=' + encodeURIComponent(url), true);
                  }
                }
              });
              
              var proxiedSrc = 'https://corsproxy.io/?url=' + encodeURIComponent(src);
              hls.loadSource(proxiedSrc);
              hls.attachMedia(v);
              
              hls.on(Hls.Events.MANIFEST_PARSED, tryPlay);
              hls.on(Hls.Events.ERROR, function(event, data) {
                console.error("Proxy HLS Error:", data);
                if (data.fatal) {
                  hls.destroy();
                  document.body.innerHTML = '<div style="color:white;text-align:center;padding:20px;">Stream blocked or offline.</div>';
                }
              });
            }

            if (src.includes('.m3u8')) {
              if (isIOS) {
                // Native Player (iPhone/iPad)
                v.src = src;
                v.addEventListener('loadedmetadata', tryPlay);
                v.onerror = startDirectHls;
              } else {
                // Direct HLS (Desktop/Android) with aggressive 4s fallback
                startDirectHls();
              }
            } else {
              // MP4s
              v.src = src;
              v.addEventListener('loadedmetadata', tryPlay);
            }
          <\/script>
        </body>
        </html>
      `;

      player.srcdoc = playerHtml;
    }

    init();
  </script>
</body>
</html>
