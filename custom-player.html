<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <!-- Try to control browser referrer behavior -->
  <meta name="referrer" content="no-referrer" />
  <title>Custom Player</title>
  <style>
    html, body { 
      margin: 0; padding: 0; width: 100%; height: 100%; 
      background: #000; color: #fff; font-family: Arial, sans-serif; 
      overflow: hidden; touch-action: none; position: fixed;
    }
    video { width: 100vw; height: 100vh; object-fit: contain; background: #000; display: none; }
    #status { 
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      text-align: center; padding: 20px; z-index: 10; max-width: 90vw; word-break: break-word;
    }
    button {
      margin-top: 15px; padding: 10px 20px; background: #fff; color: #000;
      border: none; border-radius: 5px; cursor: pointer; font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="status">Fetching stream...</div>
  <video id="video" controls autoplay playsinline webkit-playsinline muted></video>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    window.addEventListener('unhandledrejection', event => {
      if (event.reason && (event.reason.name === 'AbortError' || /aborted/i.test(event.reason.message || ''))) {
        event.preventDefault();
      }
    });

    const urlParams = new URLSearchParams(window.location.search);
    const imdb = urlParams.get('imdb') || 'tt1375666'; 
    const apiUrl = `/api/getstream?imdb=${imdb}`;

    const video = document.getElementById('video');
    const statusEl = document.getElementById('status');

    // We will append the Referer as a URL parameter. Some proxies/CDNs read this, browsers do not.
    const STREAM_REFERER = "https://example.com"; 

    // Proxy fallback chain
    const PROXIES = [
      (url) => `https://corsproxy.io/?url=${encodeURIComponent(url)}`,
      (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
      (url) => `https://thingproxy.freeboard.io/fetch/${url}`
    ];

    let hls = null;
    let unmuted = false;

    const unmute = () => {
      if (!unmuted) {
        video.muted = false;
        unmuted = true;
        video.play().catch(() => {});
      }
    };
    document.addEventListener('click', unmute);
    document.addEventListener('touchstart', unmute);

    function showError(msg) {
      statusEl.style.display = 'block';
      video.style.display = 'none';
      statusEl.innerHTML = `Stream failed to load.<br><br><small style="opacity:0.7">${msg}</small><br><button onclick="location.reload()" style="margin-top: 20px;">Reload Player</button>`;
    }

    async function init() {
      fetch(apiUrl).catch(() => {});
      
      try {
        statusEl.innerText = "Fetching stream...";
        const res = await fetch(apiUrl);
        const text = await res.text();
        
        let data;
        try {
            data = JSON.parse(text);
        } catch (e) {
            throw new Error(`API Response: ${text.substring(0, 150)}`);
        }
        
        if (!data.streamUrl) {
          throw new Error(data.error || "API did not return a stream URL.");
        }

        statusEl.style.display = 'none';
        video.style.display = 'block';

        await startPlayback(data.streamUrl);
        
      } catch (error) {
        showError(error.message);
      }
    }

    async function startPlayback(streamUrl) {
      const supportsNative = video.canPlayType('application/vnd.apple.mpegurl');

      if (supportsNative) {
        video.src = streamUrl;
        video.addEventListener('loadedmetadata', () => {
          video.play().catch(e => console.log("Autoplay blocked: ", e));
        }, { once: true });
        
        video.onerror = async () => {
          video.removeAttribute('src');
          video.load();
          await startHlsWithRewrittenManifest(streamUrl);
        };
      } else {
        await startHlsWithRewrittenManifest(streamUrl);
      }
    }

    // Try fetching the manifest through multiple proxies
    async function fetchManifestWithFallback(streamUrl) {
      let lastError = null;
      const fetchOptions = {
        method: 'GET',
        headers: {
          'X-Referer': STREAM_REFERER,
          'Origin': STREAM_REFERER
        }
      };

      for (let i = 0; i < PROXIES.length; i++) {
        const proxyFn = PROXIES[i];
        const proxiedUrl = proxyFn(streamUrl);
        try {
          const res = await fetch(proxiedUrl, fetchOptions);
          if (res.ok) {
            const text = await res.text();
            if (text && text.includes('#EXTM3U')) {
              return { text, proxyIndex: i }; 
            }
            lastError = new Error("Invalid manifest format.");
          } else {
            lastError = new Error(`Proxy ${i} returned ${res.status}`);
          }
        } catch (err) {
          lastError = err;
        }
      }
      throw lastError || new Error("Timeout or could not bypass anti-bot.");
    }

    async function startHlsWithRewrittenManifest(streamUrl) {
      if (hls) hls.destroy();

      if (!window.Hls || !Hls.isSupported()) {
        showError("HLS not supported in this browser.");
        return;
      }

      try {
        statusEl.style.display = 'block';
        statusEl.innerText = "Bypassing CORS (Trying proxies)...";
        
        const { text: m3u8Text, proxyIndex } = await fetchManifestWithFallback(streamUrl);
        const workingProxy = PROXIES[proxyIndex];
        
        const lines = m3u8Text.split('\n');

        for (let i = 0; i < lines.length; i++) {
          const line = lines[i].trim();
          if (line && !line.startsWith('#')) {
            const absoluteUrl = new URL(line, streamUrl).href;
            // Pass referer as URL param as a last hope for picky CDNs
            lines[i] = workingProxy(`${absoluteUrl}&referer=${encodeURIComponent(STREAM_REFERER)}`);
          } else if (line.startsWith('#EXT-X-KEY') || line.startsWith('#EXT-X-MAP')) {
            lines[i] = line.replace(/URI="([^"]+)"/g, (match, p1) => {
              const absoluteUrl = new URL(p1, streamUrl).href;
              return `URI="${workingProxy(`${absoluteUrl}&referer=${encodeURIComponent(STREAM_REFERER)}`)}"`;
            });
          }
        }

        const rewrittenManifest = lines.join('\n');
        const blob = new Blob([rewrittenManifest], { type: 'application/vnd.apple.mpegurl' });
        const blobUrl = URL.createObjectURL(blob);

        statusEl.style.display = 'none';

        hls = new Hls({ 
          maxBufferLength: 30, 
          enableWorker: true,
          xhrSetup: (xhr, url) => {
            // Try adding custom headers
            try {
              xhr.setRequestHeader('X-Referer', STREAM_REFERER);
              xhr.setRequestHeader('Origin', STREAM_REFERER);
            } catch(e) {}
          }
        });
        
        hls.loadSource(blobUrl);
        hls.attachMedia(video);

        const timeout = setTimeout(() => {
          showError("Timeout or could not bypass anti-bot. Host is blocking public proxies or enforcing strict Referers.");
        }, 15000);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          clearTimeout(timeout);
          video.play().catch(e => console.log("Autoplay blocked: ", e));
        });

        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.details && data.details.includes('aborted')) return;
          if (data.fatal) {
            clearTimeout(timeout);
            console.error("HLS.js FATAL Error:", data.details);
            showError(`Video chunk error: ${data.details}`);
          }
        });

      } catch (error) {
        showError("Failed to bypass CORS: " + error.message);
      }
    }

    init();
  </script>
</body>
</html>
