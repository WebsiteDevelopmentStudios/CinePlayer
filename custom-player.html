<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Custom Player</title>
  <style>
    html, body { 
      margin: 0; 
      padding: 0; 
      width: 100%; 
      height: 100%; 
      background: #000; 
      color: #fff; 
      font-family: Arial, sans-serif; 
      overflow: hidden; 
      touch-action: none;
      position: fixed;
    }
    
    video { 
      width: 100vw; 
      height: 100vh; 
      object-fit: contain; 
      background: #000;
      display: none;
    }
    
    #status { 
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      padding: 20px; 
      z-index: 10;
      max-width: 90vw;
      word-break: break-word;
    }
    
    button {
      margin-top: 15px;
      padding: 10px 20px;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="status">Fetching stream...</div>
  <video id="video" controls autoplay playsinline webkit-playsinline muted></video>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const imdb = urlParams.get('imdb') || 'tt1375666'; 
    const apiUrl = `/api/getstream?imdb=${imdb}`;

    const video = document.getElementById('video');
    const statusEl = document.getElementById('status');

    // Expanded list of reliable public CORS proxies
    const PROXIES = [
      (url) => `https://corsproxy.io/?url=${encodeURIComponent(url)}`,
      (url) => `https://proxy.cors.sh/${url}`,
      (url) => `https://yacdn.org/proxy/${url}`,
      (url) => `https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(url)}`,
      (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
      (url) => `https://thingproxy.freeboard.io/fetch/${url}`
    ];

    let proxyIndex = -1; // -1 means direct, 0+ means proxy
    let hls = null;
    let currentSrc = null;
    let unmuted = false;

    const unmute = () => {
      if (!unmuted) {
        video.muted = false;
        unmuted = true;
        video.play().catch(() => {});
      }
    };
    document.addEventListener('click', unmute);
    document.addEventListener('touchstart', unmute);

    function showError(msg) {
      statusEl.style.display = 'block';
      video.style.display = 'none';
      statusEl.innerHTML = `Stream failed to load.<br><br><small style="opacity:0.7">${msg}</small><br><button onclick="location.reload()" style="margin-top: 20px;">Reload Player</button>`;
    }

    async function init() {
      // Silent warmup
      fetch(apiUrl).catch(() => {});
      
      try {
        statusEl.innerText = "Fetching stream...";
        const res = await fetch(apiUrl);
        const text = await res.text();
        
        let data;
        try {
            data = JSON.parse(text);
        } catch (e) {
            throw new Error(`API Response: ${text.substring(0, 150)}`);
        }
        
        if (!data.streamUrl) {
          throw new Error(data.error || "API did not return a stream URL.");
        }

        currentSrc = data.streamUrl;
        statusEl.style.display = 'none';
        video.style.display = 'block';

        startPlayback();
        
      } catch (error) {
        showError(error.message);
      }
    }

    function startPlayback() {
      const isIOS = video.canPlayType('application/vnd.apple.mpegurl');

      if (isIOS) {
        // Apple Native Player
        video.src = currentSrc;
        video.addEventListener('loadedmetadata', () => {
          video.play().catch(e => console.log("Autoplay blocked: ", e));
        }, { once: true });
        
        video.onerror = () => {
          console.log("Native iOS failed, trying HLS.js with proxy...");
          video.removeAttribute('src');
          video.load();
          startHlsWithProxy();
        };
      } else {
        // Desktop / Android using hls.js
        startHlsWithProxy();
      }
    }

    function startHlsWithProxy() {
      if (hls) hls.destroy();

      if (!window.Hls || !Hls.isSupported()) {
        showError("HLS not supported in this browser.");
        return;
      }

      const useProxy = proxyIndex >= 0;
      const activeProxyFunc = useProxy ? PROXIES[proxyIndex] : null;

      hls = new Hls({
        maxBufferLength: 30,
        // Custom loader to intercept XHRs and apply the proxy dynamically
        loader: class extends Hls.DefaultConfig.loader {
          load(context, config, callbacks) {
            if (useProxy && context.url.indexOf('http') === 0) {
              context.url = activeProxyFunc(context.url);
            }
            super.load(context, config, callbacks);
          }
        }
      });

      hls.loadSource(currentSrc);
      hls.attachMedia(video);

      let started = false;
      let fatalErrors = 0;

      const timeout = setTimeout(() => {
        if (!started) {
          console.log(`Timeout: ${useProxy ? 'Proxy ' + proxyIndex : 'Direct'} failed...`);
          fallbackToNextProxy();
        }
      }, 8000); // Increased fallback timeout to 8 seconds

      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        started = true;
        clearTimeout(timeout);
        video.play().catch(e => console.log("Autoplay blocked: ", e));
      });

      hls.on(Hls.Events.ERROR, (event, data) => {
        if (data.fatal) {
          fatalErrors++;
          if (fatalErrors > 3 || !started) {
            clearTimeout(timeout);
            console.log(`Error using ${useProxy ? 'proxy ' + proxyIndex : 'direct'}:`, data.details);
            fallbackToNextProxy();
          } else {
            // Try to recover from non-fatal or recoverable fatal errors
            hls.startLoad();
          }
        }
      });
    }

    function fallbackToNextProxy() {
      proxyIndex++;
      if (proxyIndex >= PROXIES.length) {
        showError("All CORS proxies failed or are blocked by the host.");
        return;
      }
      startHlsWithProxy();
    }

    init();
  </script>
</body>
  </html>
