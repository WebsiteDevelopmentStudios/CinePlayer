<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Disable user zoom and scaling on mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Custom Player</title>
  <style>
    /* Prevent scrolling and touch actions */
    html, body { 
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000; 
      color: #fff; 
      font-family: Arial, sans-serif; 
      overflow: hidden; 
      touch-action: none;
      position: fixed;
    }
    
    /* Make iframe cover the screen entirely */
    #player { 
      width: 100vw;
      height: 100vh;
      border: none;
      position: absolute;
      top: 0;
      left: 0;
      background: #000; 
    }
    
    #status { 
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      padding: 20px; 
      z-index: 10;
    }
    
    button {
      margin-top: 15px;
      padding: 10px 20px;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
    
    button:hover {
      background: #ccc;
    }
  </style>
</head>
<body>
  <div id="status">Fetching stream...</div>
  <iframe id="player" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" style="display:none;"></iframe>

  <script>
    const getQueryParam = (param) => {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    };

    const imdb = getQueryParam('imdb') || 'tt1375666'; 
    const apiUrl = `/api/getstream?imdb=${imdb}`;

    async function fetchStream(url) {
      // Warm up the server (Attempt 1 - silent)
      await fetch(url).catch(() => {});
      
      // Immediately fetch again (Attempt 2)
      document.getElementById('status').innerText = `Fetching stream...`;
      try {
        const response = await fetch(url);
        const data = await response.json();
        if (response.ok && data.success && data.streamUrl) {
          return data.streamUrl;
        }
      } catch (e) {}
      return null;
    }

    async function init() {
      const statusEl = document.getElementById('status');
      const player = document.getElementById('player');
      
      const streamUrl = await fetchStream(apiUrl);
      
      if (!streamUrl) {
        statusEl.style.display = 'block';
        player.style.display = 'none';
        statusEl.innerHTML = 'Stream failed to load, likely due to anti-bot or CORS restrictions.<br><button onclick="location.reload()">Reload Player</button>';
        return;
      }

      statusEl.style.display = 'none';
      player.style.display = 'block';

      // Escape quotes to prevent breaking the HTML string
      const safeStreamUrl = streamUrl.replace(/"/g, '\\"');

      // Build a fully isolated video player inside the iframe
      const playerHtml = `
        <!DOCTYPE html>
        <html>
        <head>
          <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
          <style>
            html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
            video { width: 100%; height: 100%; object-fit: contain; }
          </style>
          <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
        </head>
        <body>
          <video id="v" controls autoplay playsinline></video>
          <script>
            var v = document.getElementById('v');
            var src = "${safeStreamUrl}";
            
            // Unmute interaction helper
            function tryPlay() {
              v.muted = false;
              v.play().catch(function() {
                v.muted = true;
                v.play().catch(function(e){ console.log("Autoplay blocked entirely: ", e); });
                
                var unmute = function() {
                  if(v.muted) v.muted = false;
                  v.removeEventListener('click', unmute);
                  v.removeEventListener('touchstart', unmute);
                };
                v.addEventListener('click', unmute);
                v.addEventListener('touchstart', unmute);
              });
            }

            if (src.includes('.m3u8') && window.Hls && Hls.isSupported()) {
              var hls = new Hls();
              hls.loadSource(src);
              hls.attachMedia(v);
              
              hls.on(Hls.Events.ERROR, function(event, data) {
                console.error("Iframe HLS Error:", data);
                if (data.fatal) {
                  hls.destroy();
                  document.body.innerHTML = '<div style="color:white;font-family:sans-serif;text-align:center;padding:20px;">Stream failed to load inside player.</div>';
                }
              });
              
              hls.on(Hls.Events.MANIFEST_PARSED, tryPlay);
            } else {
              // Fallback for MP4 or native Safari HLS
              v.src = src;
              v.addEventListener('loadedmetadata', tryPlay);
            }
          </script>
        </body>
        </html>
      `;

      // Inject the standalone player into the iframe
      player.srcdoc = playerHtml;
    }

    init();
  </script>
</body>
            </html>
