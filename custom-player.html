<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    body { 
      margin: 0; 
      background: #000; 
      color: #fff; 
      font-family: Arial, sans-serif; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      height: 100vh; 
    }
    video { 
      max-width: 100%; 
      max-height: 80vh; 
      background: #000; 
    }
    #status { 
      padding: 20px; 
      text-align: center;
    }
    button {
      margin-top: 15px;
      padding: 10px 20px;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background: #ccc;
    }
  </style>
</head>
<body>
  <div id="status">Fetching stream...</div>
  <video id="video" controls autoplay style="display:none;"></video>

  <script>
    // Extract the IMDb ID from the URL parameters (defaulting if not found)
    const getQueryParam = (param) => {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    };

    const imdb = getQueryParam('imdb') || 'tt1375666'; 
    // Note: Make sure this API path matches your serverless function route
    const apiUrl = `/api/getstream?imdb=${imdb}`;

    async function fetchStream(url, retries = 3) {
      for (let i = 0; i < retries; i++) {
        document.getElementById('status').innerText = `Fetching stream... (Attempt ${i + 1} of ${retries})`;
        try {
          const response = await fetch(url);
          const data = await response.json();
          
          if (response.ok && data.success && data.streamUrl) {
            return data.streamUrl;
          }
          console.log(`Attempt ${i + 1} failed:`, data.error);
        } catch (e) {
          console.log(`Network error on attempt ${i + 1}:`, e.message);
        }
        // Wait 1.5 seconds before retrying (gives the headless browser a break)
        await new Promise(r => setTimeout(r, 1500));
      }
      return null;
    }

    async function init() {
      const statusEl = document.getElementById('status');
      const video = document.getElementById('video');
      
      const streamUrl = await fetchStream(apiUrl);
      
      if (!streamUrl) {
        statusEl.innerHTML = 'Failed to load stream after multiple attempts. It might be blocked temporarily.<br><button onclick="location.reload()">Reload Player</button>';
        return;
      }

      statusEl.style.display = 'none';
      video.style.display = 'block';

      // Handle HLS (.m3u8) playback
      if (streamUrl.includes('.m3u8')) {
        if (Hls.isSupported()) {
          const hls = new Hls();
          hls.loadSource(streamUrl);
          hls.attachMedia(video);
          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            video.play().catch(e => console.log("Auto-play blocked by browser:", e));
          });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          // Native HLS support (Safari)
          video.src = streamUrl;
          video.addEventListener('loadedmetadata', () => {
            video.play().catch(e => console.log("Auto-play blocked by browser:", e));
          });
        }
      } else {
        // Handle direct video playback (.mp4)
        video.src = streamUrl;
        video.addEventListener('loadedmetadata', () => {
          video.play().catch(e => console.log("Auto-play blocked by browser:", e));
        });
      }
    }

    init();
  </script>
</body>
    </html>
