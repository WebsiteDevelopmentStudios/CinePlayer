<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinePlayer</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; }
        #player-container { max-width: 800px; margin: 50px auto; text-align: center; }
        #status { padding: 20px; font-size: 1.2rem; }
    </style>
</head>
<body>

<div id="player-container">
    <div id="status">Fetching stream...</div>
    <!-- This is the video element -->
    <video id="video" controls width="100%" style="display:none;"></video>
</div>

<!-- Load HLS.js to play .m3u8 streams -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>
    // Get the imdb id from the URL (e.g., custom-player.html?imdb=tt1234567)
    const params = new URLSearchParams(window.location.search);
    const imdb = params.get('imdb') || 'tt1226863'; // Default test ID

    const videoElement = document.getElementById('video');
    const statusElement = document.getElementById('status');

    async function fetchStream() {
        try {
            const response = await fetch(`https://cineplayer-psi.vercel.app/api/getstream?imdb=${imdb}`);
            const data = await response.json();

            if (data.success && data.streamUrl) {
                let streamUrl = data.streamUrl;
                
                statusElement.innerText = "Loading video (Proxy)...";
                
                // Pass the original URL directly to playHLS
                playHLS(streamUrl);
            } else {
                statusElement.innerText = "Error: " + (data.error || "Could not find stream.");
            }
        } catch (error) {
            statusElement.innerText = "Fetch Error: " + error.message;
        }
    }

    function playHLS(originalUrl) {
        if (Hls.isSupported()) {
            // We use xhrSetup to ensure EVERY request hls.js makes goes through the CORS proxy
            const hls = new Hls({
                xhrSetup: (xhr, url) => {
                    // Wrap the absolute URL of the manifest or .ts chunk
                    xhr.open('GET', `https://corsproxy.io/?url=${encodeURIComponent(url)}`, true);
                }
            });
            
            hls.loadSource(originalUrl);
            hls.attachMedia(videoElement);
            
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                statusElement.style.display = 'none';
                videoElement.style.display = 'block';
                videoElement.play();
            });

            hls.on(Hls.Events.ERROR, function(event, data) {
                if (data.fatal) {
                    statusElement.innerText = "Stream Error: " + data.details;
                    statusElement.style.display = 'block';
                    videoElement.style.display = 'none';
                }
            });
        } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
            videoElement.src = originalUrl;
            videoElement.addEventListener('loadedmetadata', function() {
                statusElement.style.display = 'none';
                videoElement.style.display = 'block';
                videoElement.play();
            });
        }
    }

    fetchStream();
</script>

</body>
    </html>
